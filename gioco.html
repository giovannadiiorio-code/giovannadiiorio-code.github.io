<title>Acchiappa JAVANNA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap">
<style>
  /* Layout: una colonna centrata stile cabinato arcade — intestazione, parola da comporre, schermo di gioco, istruzioni */
  :root {
    --night: #1b1640;
    --night-2: #2d2470;
    --panel: #251d58;
    --sun: #ffc93c;
    --coral: #ff6b6b;
    --mint: #5ee6c0;
    --ink: #f6f2ff;
    --muted: #b8aee6;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night) 70%);
    background-color: var(--night);
    color: var(--ink);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 28px;
    box-sizing: border-box;
  }
  .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 {
    font-family: var(--display); font-weight: 400; margin: 0;
    font-size: clamp(1.6rem, 7vw, 2.3rem); line-height: 1; text-align: center;
    color: var(--sun); text-shadow: 3px 3px 0 var(--coral); text-wrap: balance;
  }
  .hud { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hud div { display: flex; flex-direction: column; gap: 2px; }
  .hud small { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .hud span { font-size: 1.25rem; }
  #lives { color: var(--coral); letter-spacing: .1em; }
  .word { display: flex; justify-content: center; gap: 6px; }
  .slot {
    width: 40px; height: 46px; display: grid; place-items: center;
    font-family: var(--display); font-size: 1.4rem;
    border: 2px dashed var(--muted); border-radius: 8px; color: var(--muted); opacity: .55;
    transition: transform .15s, background .15s;
  }
  .slot.next { opacity: 1; border-color: var(--sun); color: var(--sun); }
  .slot.done { opacity: 1; border: 2px solid var(--mint); background: var(--mint); color: var(--night); transform: translateY(-3px); }
  .screen { position: relative; border-radius: 14px; overflow: hidden; border: 3px solid var(--sun); box-shadow: 0 0 0 6px var(--panel); }
  canvas { display: block; width: 100%; aspect-ratio: 3 / 4; max-width: 100%; touch-action: none; cursor: none; background: var(--night); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: rgba(27, 22, 64, .86);
  }
  .overlay h2 { font-family: var(--display); font-weight: 400; margin: 0; font-size: 1.7rem; color: var(--sun); text-wrap: balance; }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.45; color: var(--ink); }
  button {
    font-family: var(--display); font-size: 1.1rem; padding: 12px 26px; border: 0; border-radius: 10px;
    background: var(--coral); color: var(--ink); cursor: pointer; box-shadow: 0 5px 0 #b8414a;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8414a; }
  button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
  .help { font-size: .9rem; color: var(--muted); text-align: center; line-height: 1.5; margin: 0; }
  .help b { color: var(--ink); }
  .sound { align-self: center; font-family: var(--body); font-weight: 800; font-size: .85rem; padding: 6px 14px; background: var(--panel); box-shadow: none; color: var(--muted); }
  [hidden] { display: none !important; }
</style>

<div class="wrap">
  <h1>Acchiappa JAVANNA</h1>
  <div class="hud">
    <div><small>Punti</small><span id="score">0</span></div>
    <div style="text-align:center"><small>Livello</small><span id="level">1</span></div>
    <div style="text-align:right"><small>Vite</small><span id="lives">♥♥♥</span></div>
  </div>
  <div class="word" id="word"></div>
  <div class="screen">
    <canvas id="board" width="360" height="480" aria-label="Schermo di gioco"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Pronta a giocare?</h2>
      <p id="ovText">Muovi il cestino e prendi le lettere <b>nell'ordine giusto</b> per scrivere JAVANNA. Le lettere sbagliate ti tolgono una vita. Le stelle d'oro valgono 25 punti!</p>
      <button id="startBtn">Gioca</button>
      <p id="best" style="color:var(--muted);font-size:.9rem"></p>
    </div>
  </div>
  <p class="help">Computer: <b>← →</b> oppure <b>A D</b> · Telefono: trascina il dito sullo schermo</p>
  <button class="sound" id="soundBtn">Suono: acceso</button>
</div>

<script>
(() => {
  const W = 360, H = 480, WORD = "JAVANNA";
  const DECOYS = "BCDEFGHIKLMOPRSTUVZ";
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const COL = { sun: C("--sun"), coral: C("--coral"), mint: C("--mint"), ink: C("--ink"), muted: C("--muted"), night: C("--night"), night2: C("--night-2") };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Schermo nitido su ogni display
  let scale = 1;
  function resize() {
    const w = canvas.getBoundingClientRect().width || W;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * (H / W) * dpr);
    scale = canvas.width / W;
  }
  addEventListener("resize", resize);
  resize();

  // Stelle di sfondo
  const sky = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, t: Math.random() * 6 }));

  // Suoni semplici
  let audio = null, soundOn = true;
  function beep(freq, dur = .1, type = "square", vol = .06) {
    if (!audio || !soundOn) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }
  $("soundBtn").onclick = () => { soundOn = !soundOn; $("soundBtn").textContent = "Suono: " + (soundOn ? "acceso" : "spento"); };

  // Record personale
  const getBest = () => { try { return +localStorage.getItem("javanna-best") || 0; } catch { return 0; } };
  const setBest = v => { try { localStorage.setItem("javanna-best", v); } catch {} };
  function showBest() { const b = getBest(); $("best").textContent = b ? "Record: " + b + " punti" : ""; }
  showBest();

  // Stato di gioco
  let s;
  function reset() {
    s = { px: W / 2, target: null, pw: 74, idx: 0, score: 0, level: 1, lives: 3,
          items: [], fx: [], spawn: 0, running: false, shake: 0 };
    renderWord(); renderHud();
  }

  function renderWord() {
    $("word").innerHTML = [...WORD].map((ch, i) =>
      `<div class="slot ${i < s.idx ? "done" : i === s.idx ? "next" : ""}">${ch}</div>`).join("");
  }
  function renderHud() {
    $("score").textContent = s.score;
    $("level").textContent = s.level;
    $("lives").textContent = "♥".repeat(Math.max(0, s.lives)) || "—";
  }

  function spawnItem() {
    const speed = 85 + s.level * 18 + Math.random() * 35;
    const x = 22 + Math.random() * (W - 44);
    if (Math.random() < .08) { s.items.push({ kind: "star", x, y: -20, r: 15, v: speed * 1.15, rot: 0 }); return; }
    const need = WORD[s.idx];
    const ch = Math.random() < .48 ? need : DECOYS[Math.floor(Math.random() * DECOYS.length)];
    s.items.push({ kind: "letter", ch, x, y: -20, r: 19, v: speed, wob: Math.random() * 6 });
  }

  function floatText(x, y, text, color) { s.fx.push({ type: "text", x, y, text, color, life: 1 }); }
  function burst(x, y, color, n = 14) {
    if (reduceMotion) n = 4;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
      s.fx.push({ type: "dot", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, color, life: 1 });
    }
  }

  function catchItem(it) {
    if (it.kind === "star") {
      s.score += 25; floatText(it.x, it.y, "+25", COL.sun); burst(it.x, it.y, COL.sun);
      beep(880, .08, "triangle"); setTimeout(() => beep(1320, .1, "triangle"), 70);
    } else if (it.ch === WORD[s.idx]) {
      s.idx++; s.score += 10; floatText(it.x, it.y, "+10", COL.mint); burst(it.x, it.y, COL.mint, 8);
      beep(520 + s.idx * 70, .09);
      if (s.idx === WORD.length) wordComplete();
    } else {
      s.lives--; s.shake = reduceMotion ? 0 : .3;
      floatText(it.x, it.y, "Ops! " + it.ch, COL.coral); burst(it.x, it.y, COL.coral, 8);
      beep(140, .25, "sawtooth", .08);
      if (s.lives <= 0) return gameOver();
    }
    renderWord(); renderHud();
  }

  function wordComplete() {
    s.score += 50 + s.level * 10;
    floatText(W / 2, H / 2, "JAVANNA! +" + (50 + s.level * 10), COL.sun);
    for (let i = 0; i < 5; i++) burst(40 + Math.random() * (W - 80), 120 + Math.random() * 200, [COL.sun, COL.mint, COL.coral][i % 3], 18);
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .14, "triangle"), i * 110));
    s.level++; s.idx = 0; s.items = [];
    s.pw = Math.max(52, 74 - s.level * 2);
  }

  function gameOver() {
    s.running = false;
    const best = getBest();
    if (s.score > best) setBest(s.score);
    $("ovTitle").textContent = s.score > best ? "Nuovo record!" : "Partita finita";
    $("ovText").innerHTML = `Hai fatto <b>${s.score} punti</b> e sei arrivata al livello <b>${s.level}</b>.`;
    $("startBtn").textContent = "Gioca ancora";
    showBest();
    $("overlay").hidden = false;
    $("startBtn").focus();
    renderHud();
  }

  // Comandi
  const keys = {};
  addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (["arrowleft", "arrowright"].includes(e.key.toLowerCase()) && s.running) e.preventDefault();
    s.target = null;
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  function pointer(e) {
    const r = canvas.getBoundingClientRect();
    s.target = (e.clientX - r.left) / r.width * W;
  }
  canvas.addEventListener("pointermove", pointer);
  canvas.addEventListener("pointerdown", pointer);

  $("startBtn").onclick = () => {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    reset(); s.running = true; $("overlay").hidden = true; last = performance.now();
  };

  // Disegno
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawStar(x, y, r, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * .45 : r, a = i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fillStyle = COL.sun; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = COL.coral; ctx.stroke(); ctx.restore();
  }
  function drawBasket(x) {
    const w = s.pw, h = 30, y = H - 46;
    ctx.fillStyle = "#c98a3c"; roundRect(x - w / 2, y, w, h, 8); ctx.fill();
    ctx.strokeStyle = "#8a5a22"; ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) { const lx = x - w / 2 + (w / 5) * i; ctx.beginPath(); ctx.moveTo(lx, y + 3); ctx.lineTo(lx, y + h - 3); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x - w / 2 + 4, y + h / 2); ctx.lineTo(x + w / 2 - 4, y + h / 2); ctx.stroke();
    ctx.fillStyle = "#e3a656"; roundRect(x - w / 2 - 5, y - 6, w + 10, 9, 4); ctx.fill();
  }

  function draw(t) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (s.shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, COL.night); g.addColorStop(1, COL.night2);
    ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);
    for (const st of sky) {
      ctx.globalAlpha = .4 + .4 * Math.sin(t / 700 + st.t);
      ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(94,230,192,.18)"; ctx.fillRect(0, H - 14, W, 14);

    const need = WORD[s.idx];
    for (const it of s.items) {
      if (it.kind === "star") { drawStar(it.x, it.y, it.r, it.rot); continue; }
      const x = it.x + Math.sin(t / 300 + it.wob) * 3;
      ctx.beginPath(); ctx.arc(x, it.y, it.r, 0, 7);
      ctx.fillStyle = COL.ink; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = it.ch === need ? COL.mint : COL.muted; ctx.stroke();
      ctx.fillStyle = COL.night; ctx.font = "22px Bungee, Impact, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(it.ch, x, it.y + 2);
    }

    drawBasket(s.px);

    for (const f of s.fx) {
      ctx.globalAlpha = Math.max(0, f.life);
      if (f.type === "dot") { ctx.fillStyle = f.color; ctx.fillRect(f.x - 3, f.y - 3, 6, 6); }
      else {
        ctx.fillStyle = f.color; ctx.font = "20px Bungee, Impact, sans-serif";
        ctx.textAlign = "center"; ctx.fillText(f.text, f.x, f.y);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Ciclo di gioco
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (s.running) {
      const dir = (keys["arrowright"] || keys["d"] ? 1 : 0) - (keys["arrowleft"] || keys["a"] ? 1 : 0);
      if (dir) s.px += dir * 340 * dt;
      else if (s.target != null) s.px += (s.target - s.px) * Math.min(1, dt * 14);
      s.px = Math.max(s.pw / 2, Math.min(W - s.pw / 2, s.px));

      s.spawn -= dt;
      if (s.spawn <= 0) { spawnItem(); s.spawn = Math.max(.38, .95 - s.level * .07) * (.7 + Math.random() * .6); }

      const by = H - 46;
      for (const it of s.items) {
        it.y += it.v * dt;
        if (it.kind === "star") it.rot += dt * 3;
        if (!it.gone && it.y + it.r >= by && it.y - it.r <= by + 20 && Math.abs(it.x - s.px) < s.pw / 2 + it.r * .5) {
          it.gone = true; catchItem(it);
          if (!s.running) break;
        }
        if (it.y - it.r > H) it.gone = true;
      }
      s.items = s.items.filter(i => !i.gone);
      s.shake = Math.max(0, s.shake - dt);
    }
    for (const f of s.fx) {
      f.life -= dt * (f.type === "text" ? .9 : 1.6);
      if (f.type === "dot") { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 300 * dt; }
      else f.y -= 40 * dt;
    }
    s.fx = s.fx.filter(f => f.life > 0);
    draw(t);
    requestAnimationFrame(loop);
  }

  reset();
  // Lettere d'esempio dietro la schermata iniziale
  s.items = [{ kind: "letter", ch: "J", x: 90, y: 140, r: 19, v: 0, wob: 0 }, { kind: "letter", ch: "K", x: 250, y: 220, r: 19, v: 0, wob: 2 }, { kind: "star", x: 170, y: 320, r: 15, v: 0, rot: .3 }];
  requestAnimationFrame(loop);
})();
</script>
